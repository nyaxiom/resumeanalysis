name: checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra qwen --extra profile-llm --extra documents
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest -q
      - run: uv build
      - run: uv run --frozen python scripts/check_runtime_wheel.py dist/resumeanalysis-*.whl
      - run: uv sync --frozen --group research --extra dev --extra qwen --extra profile-llm --extra documents
      - run: uv run --frozen --group research pytest -q legacy/tests
      - run: uv build --package resumeanalysis-legacy
